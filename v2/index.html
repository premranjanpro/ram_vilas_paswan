<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>रामविलास पासवान — 100 पृष्ठीय डिजिटल महा-ग्रंथ (v2 संस्करण)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="js/pages-data.js"></script>
<style>
:root {
  --paper: #ffffff;
  --ink: #262420;
  --accent: #9b2f24;
  --gold: #d3a448;
  --navy: #0e1e36;
  --subtle: #796c56;
  --border: #e3d5b8;
  --card-shadow: 0 12px 40px rgba(14, 30, 54, 0.22);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(circle at 10% 12%, #ebe0c8, transparent 30%), #e6e2d8;
  color: var(--ink);
  font-family: 'Hind', sans-serif;
  -webkit-font-smoothing: antialiased;
}

header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: #0e1e36f5;
  backdrop-filter: blur(10px);
  color: #fff;
  padding: 11px 22px;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  box-shadow: 0 6px 20px rgba(0,0,0,0.35);
  border-bottom: 2px solid var(--gold);
}
.brand {
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  margin-right: auto;
  display: flex;
  flex-direction: column;
}
.brand small {
  font-size: 11px;
  font-weight: 400;
  color: var(--gold);
  letter-spacing: 0.05em;
}
select, input, button {
  font: inherit;
  border-radius: 6px;
}
select {
  padding: 7px 12px;
  background: #182e4e;
  color: #fff;
  border: 1px solid #36537d;
  max-width: 270px;
  cursor: pointer;
}
button {
  border: 0;
  padding: 8px 15px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.2s ease;
}
button:hover { transform: translateY(-1px); }
.btn-gold { background: var(--gold); color: var(--navy); }
.btn-light { background: #ffffff; color: var(--navy); }
.btn-danger { background: #9b2f24; color: #ffffff; }

#book {
  padding: 30px 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.page {
  display: none;
  width: 148mm;
  min-height: 210mm;
  margin: 0 auto 30px;
  background: #ffffff;
  padding: 14mm 14mm 13mm;
  box-shadow: 0 12px 40px rgba(14, 30, 54, 0.22);
  position: relative;
  overflow: hidden;
  border: 1px solid var(--border);
}
.page.active {
  display: block !important;
}
.cover-page, .cover {
  background: linear-gradient(180deg, rgba(9, 24, 44, 0) 0%, rgba(9, 24, 44, 0.3) 38%, rgba(9, 24, 44, 0.98) 70%), url('assets/ram-vilas-paswan.jpg') top center / cover no-repeat !important;
  color: #fff !important;
  padding: 0 !important;
}
.cover-page.active, .cover.active {
  display: flex !important;
  flex-direction: column !important;
  justify-content: flex-end !important;
  min-height: 210mm !important;
}
.cover-content {
  margin-top: auto !important;
  padding: 24px 26px 28px !important;
  background: linear-gradient(180deg, transparent 0%, rgba(9, 24, 44, 0.92) 25%, #09182c 100%);
  position: relative !important;
  z-index: 2 !important;
}

/* Page 02 TOC Layout */
.toc-title {
  font: 400 36px/1.25 "Tiro Devanagari Hindi", serif;
  color: var(--navy);
  margin: 20px 0 4px;
  text-align: left;
}
.toc-kicker {
  color: #997126;
  font-weight: 700;
  letter-spacing: 0.08em;
  margin-bottom: 20px;
  font-size: 14px;
}
.toc-list {
  display: flex;
  flex-direction: column;
  gap: 0;
  margin: 15px 0;
}
.toc-row {
  display: grid;
  grid-template-columns: 36px 1fr auto;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px dotted #c8b892;
  align-items: center;
}
.toc-row .idx {
  font: 20px "Tiro Devanagari Hindi", serif;
  color: var(--gold);
  font-weight: 700;
}
.toc-row .txt {
  font-size: 15px;
  font-weight: 600;
  color: var(--navy);
}
.toc-row .pg {
  color: var(--subtle);
  font-size: 13px;
}

/* Page 03 Portrait Layout */
.h-title {
  font: 400 36px/1.25 "Tiro Devanagari Hindi", serif;
  color: var(--navy);
  margin: 18px 0 4px;
}
.h-kicker {
  color: #997126;
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 20px;
}
.portrait-grid {
  display: grid;
  grid-template-columns: 42% 1fr;
  gap: 20px;
  margin: 16px 0;
}
.portrait-grid img {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: cover;
  object-position: top;
  box-shadow: 8px 8px #eadbbd;
  border-radius: 2px;
}
.lead-txt {
  font: 18px/1.7 "Tiro Devanagari Hindi", serif;
  color: #3a3833;
  margin-bottom: 10px;
}
p.drop-cap:first-letter {
  float: left;
  font: 55px/.8 "Tiro Devanagari Hindi", serif;
  color: var(--gold);
  padding: 8px 8px 0 0;
}
.facts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 20px 0;
}
.fact-card {
  padding: 10px 12px;
  background: #f5f1e9;
  border: 1px solid var(--border);
}
.fact-card b {
  display: block;
  color: var(--navy);
  font-size: 15px;
}
.fact-card span {
  font-size: 13px;
  color: var(--subtle);
}

p {
  font-family: 'Tiro Devanagari Hindi', serif;
  font-size: 16px;
  line-height: 1.8;
  text-align: justify;
  margin: 0 0 14px;
  color: #272420;
}
.sec-heading {
  font-family: 'Hind', sans-serif;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--accent);
  margin-top: 14px;
  margin-bottom: 4px;
  text-transform: uppercase;
  border-bottom: 1px solid #eddcb9;
  padding-bottom: 2px;
}
.quote-box {
  margin: 20px 0;
  padding: 14px 18px;
  border-left: 5px solid var(--gold);
  background: #f6eedf;
  color: var(--navy);
  font: 17px/1.6 "Tiro Devanagari Hindi", serif;
  font-style: italic;
}

.nav-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
  padding: 14px;
  background: #0e1e3612;
  position: sticky;
  bottom: 0;
  backdrop-filter: blur(6px);
  border-top: 1px solid var(--border);
}
.page-input {
  width: 55px;
  text-align: center;
  padding: 5px;
  background: #fff;
  border: 1px solid #ccc;
}

.login-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  z-index: 100;
  place-items: center;
}
.login-box {
  background: #fff;
  padding: 24px;
  border-radius: 10px;
  width: min(380px, 92vw);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
.login-box input {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border: 1px solid #ccc;
}

[contenteditable="true"] {
  outline: 2px dashed var(--gold);
  outline-offset: 3px;
}
.editbar {
  display: none;
  gap: 8px;
  align-items: center;
}
body.editing .editbar { display: flex; }

@media (max-width: 700px) {
  #book { padding: 10px 4px; }
  .page { width: 100%; min-height: auto; padding: 24px 18px; }
  select { max-width: 130px; font-size: 11px; }
  .portrait-grid { grid-template-columns: 1fr; }
}

@media print {
  header, .nav-bar, .login-modal { display: none !important; }
  body { background: #fff; }
  #book { padding: 0; }
  .page {
    box-shadow: none;
    margin: 0;
    width: 148mm;
    min-height: 210mm;
    page-break-after: always;
    border: 0;
  }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    जननायक रामविलास पासवान
    <small>100-पृष्ठीय डिजिटल महा-ग्रंथ (v2)</small>
  </div>
  
  <select id="milestoneSelect" onchange="jumpToMilestone(this.value)">
    <option value="">-- पड़ाव चुनें --</option>
  </select>

  <button onclick="prev()">◀ पिछला</button>
  <span id="counter" style="font-weight:600">1 / 100</span>
  <button onclick="next()">अगला ▶</button>

  <button id="pdfBtn" class="btn-gold" onclick="downloadPdf()">⬇ PDF डाउनलोड (1-Click)</button>
  <button id="loginBtn" class="btn-light" onclick="openLogin()">संपादन मोड</button>

  <span class="editbar">
    <button class="btn-gold" onclick="saveEdits()">सहेजें (Save)</button>
    <button class="btn-light" onclick="downloadHtml()">HTML डाउनलोड</button>
    <button class="btn-danger" onclick="logout()">लॉगआउट</button>
  </span>
</header>

<main id="book"></main>

<div class="nav-bar">
  <button class="btn-light" onclick="prev()">← पिछला पृष्ठ</button>
  <span>पृष्ठ दर्ज करें: <input type="number" id="pageJump" min="1" max="100" value="1" class="page-input"> <button class="btn-light" onclick="jumpToPageInput()">Go</button></span>
  <button class="btn-gold" onclick="next()">अगला पृष्ठ →</button>
</div>

<div class="login-modal" id="loginModal">
  <div class="login-box">
    <h3>संपादक लॉगिन</h3>
    <input id="loginUser" placeholder="उपयोगकर्ता नाम (Username)" value="admin">
    <input id="loginPass" type="password" placeholder="पासवर्ड (Password)" value="paswan2026">
    <button class="btn-gold" style="width:100%;margin-top:6px;" onclick="doLogin()">लॉगिन करें</button>
    <button class="btn-light" style="width:100%;margin-top:6px;" onclick="closeLogin()">रद्द करें</button>
    <p><small style="color:#666">डेमो क्रेडेंशियल: admin / paswan2026</small></p>
  </div>
</div>

<script>

/* Attractive Toast Notification System (Replaces Browser Alert) */
function showToast(msg, type = 'info') {
  let toastContainer = document.getElementById('toastContainer');
  if (!toastContainer) {
    toastContainer = document.createElement('div');
    toastContainer.id = 'toastContainer';
    toastContainer.style.cssText = 'position:fixed;top:22px;right:22px;z-index:99999;display:flex;flex-direction:column;gap:10px;pointer-events:none;';
    document.body.appendChild(toastContainer);
  }
  const toast = document.createElement('div');
  toast.className = 'toast-banner';
  toast.style.cssText = 'background: #0e1e36f0; color: #fff; border-left: 5px solid #d3a448; padding: 13px 22px; border-radius: 8px; box-shadow: 0 12px 35px rgba(0,0,0,0.4); backdrop-filter: blur(10px); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 12px; transform: translateY(-10px); opacity: 0; transition: all 0.3s cubic-bezier(0.18,0.89,0.32,1.28); pointer-events: auto; font-family: "Hind", sans-serif;';
  
  if (type === 'error') toast.style.borderLeftColor = '#e74c3c';
  if (type === 'success') toast.style.borderLeftColor = '#2ecc71';

  const icon = type === 'error' ? '⚠️' : (type === 'success' ? '✅' : '🔔');
  toast.innerHTML = `<span style="font-size:18px;">${icon}</span> <span>${msg}</span>`;
  toastContainer.appendChild(toast);

  requestAnimationFrame(() => {
    toast.style.transform = 'translateY(0)';
    toast.style.opacity = '1';
  });

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(-15px)';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

// Override default browser alert
window.alert = function(msg) {
  const isErr = msg.includes('गलत') || msg.includes('त्रुटि') || msg.includes('error');
  showToast(msg, isErr ? 'error' : 'success');
};

let bookData = window.RAM_VILAS_BOOK;

const savedEdits = localStorage.getItem('RAM_VILAS_BOOK_EDITED_V2');
if (savedEdits) {
  try { bookData = JSON.parse(savedEdits); } catch(e){}
}

const bookContainer = document.getElementById('book');
const milestoneSelect = document.getElementById('milestoneSelect');
let currentPage = 1;
let isLoggedIn = false;

// Populate Milestones Dropdown
if (bookData.milestones) {
  bookData.milestones.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.pages[0];
    opt.textContent = `[${m.num}] ${m.title}`;
    milestoneSelect.appendChild(opt);
  });
}

function renderBook() {
  bookContainer.innerHTML = '';
  bookData.pages.forEach((p) => {
    const pageEl = document.createElement('section');
    pageEl.id = `page-node-${p.pageNumber}`;
    pageEl.style.display = (p.pageNumber === currentPage) ? (p.pageNumber === 1 ? 'flex' : 'block') : 'none';

    if (p.pageNumber === 1) {
      // Clean Cover Layout - Positioned at bottom
      pageEl.className = 'page cover-page' + (p.pageNumber === currentPage ? ' active' : '');
      pageEl.innerHTML = `
        <div class="cover-content">
          <div class="cover-badge">श्रद्धांजलि विशेषांक • 100-पृष्ठीय v2 संस्करण</div>
          <h1 ${isLoggedIn ? 'contenteditable="true"' : ''}>जननायक<br>रामविलास पासवान</h1>
          <div class="cover-line"></div>
          <div class="cover-sub" ${isLoggedIn ? 'contenteditable="true"' : ''}>${p.subtitle}</div>
          <p class="cover-desc" ${isLoggedIn ? 'contenteditable="true"' : ''}>${p.sections[0] ? p.sections[0].content : ''}</p>
        </div>
        <div class="num" style="color:#fff;">01</div>
      `;
    } else if (p.pageNumber === 2) {
      // TOC Layout
      pageEl.className = 'page' + (p.pageNumber === currentPage ? ' active' : '');
      let tocRowsHtml = '';
      if (bookData.milestones) {
        bookData.milestones.slice(0, 10).forEach(m => {
          tocRowsHtml += `
            <div class="toc-row">
              <span class="idx">${String(m.num).padStart(2, '0')}</span>
              <span class="txt">${m.title}</span>
              <span class="pg">${String(m.pages[0]).padStart(2, '0')}</span>
            </div>
          `;
        });
      }

      pageEl.innerHTML = `
        <div class="head-bar"><span>पुस्तक परिचय</span><span>विषय-सूची</span></div>
        <h2 class="toc-title">${p.title}</h2>
        <div class="toc-kicker">${p.subtitle}</div>
        <div class="toc-list">${tocRowsHtml}</div>
        <div class="quote-box" style="margin-top:14px;font-size:14px;">${p.quote || ''}</div>
        <div class="num">02</div>
      `;
    } else if (p.pageNumber === 3) {
      // Page 3 Layout
      pageEl.className = 'page' + (p.pageNumber === currentPage ? ' active' : '');
      pageEl.innerHTML = `
        <div class="head-bar"><span>अध्याय एक</span><span>आरंभ</span></div>
        <h2 class="h-title">${p.title}</h2>
        <div class="h-kicker">${p.subtitle}</div>
        <div class="portrait-grid">
          <div>
            <img src="assets/ram-vilas-paswan.jpg" alt="रामविलास पासवान">
            <div style="font-size:11px;color:#746f65;margin-top:6px;">चित्र: प्रेस सूचना ब्यूरो (PIB), भारत सरकार</div>
          </div>
          <div>
            <p class="lead-txt">${p.sections[0] ? p.sections[0].content : ''}</p>
            <p class="drop-cap">${p.sections[1] ? p.sections[1].content : ''}</p>
          </div>
        </div>
        <div class="facts-grid">
          <div class="fact-card"><b>जन्म</b><span>5 जुलाई 1946, शहरबन्नी, खगड़िया</span></div>
          <div class="fact-card"><b>शिक्षा</b><span>एम.ए., एल.एल.बी.; मानद डी.लिट.</span></div>
          <div class="fact-card"><b>सामाजिक आधार</b><span>वंचित, श्रमिक और शोषित समाज</span></div>
          <div class="fact-card"><b>पहचान</b><span>जननेता, 9 बार सांसद, कुशल मंत्री</span></div>
        </div>
        <div class="num">03 / 100</div>
      `;
    } else {
      // Standard Chapter Page
      pageEl.className = 'page' + (p.pageNumber === currentPage ? ' active' : '');
      pageEl.innerHTML = `
        <div class="head-bar"><span>${p.milestone}</span><span>पृष्ठ ${p.pageNumber}</span></div>
        <h2 class="h-title" ${isLoggedIn ? 'contenteditable="true"' : ''}>${p.title}</h2>
        <div class="h-kicker" ${isLoggedIn ? 'contenteditable="true"' : ''}>${p.subtitle}</div>
        
        ${p.sections.map(s => `
          ${s.heading ? `<div class="sec-heading">${s.heading}</div>` : ''}
          <p ${isLoggedIn ? 'contenteditable="true"' : ''}>${s.content}</p>
        `).join('')}
        
        ${p.quote ? `<div class="quote-box" ${isLoggedIn ? 'contenteditable="true"' : ''}>${p.quote}</div>` : ''}
        
        <div class="num">${String(p.pageNumber).padStart(2, '0')} / 100</div>
      `;
    }

    bookContainer.appendChild(pageEl);
  });

  document.getElementById('counter').textContent = `${currentPage} / ${bookData.totalPages || 100}`;
  document.getElementById('pageJump').value = currentPage;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function next() {
  if (currentPage < (bookData.totalPages || 100)) {
    currentPage++;
    renderBook();
  }
}

function prev() {
  if (currentPage > 1) {
    currentPage--;
    renderBook();
  }
}

function jumpToMilestone(pageNo) {
  if (pageNo) {
    currentPage = parseInt(pageNo, 10);
    renderBook();
  }
}

function jumpToPageInput() {
  const val = parseInt(document.getElementById('pageJump').value, 10);
  if (val >= 1 && val <= (bookData.totalPages || 100)) {
    currentPage = val;
    renderBook();
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
});

async function downloadPdf() {
  const btn = document.getElementById('pdfBtn');
  const oldText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '⏳ 100-पेज PDF बन रही है...';

  try {
    if (typeof html2pdf === 'undefined') {
      alert('Print सुविधा का उपयोग करें।');
      window.print();
      return;
    }

    const pageNodes = document.querySelectorAll('.page');
    pageNodes.forEach(p => p.style.display = 'block');

    const opt = {
      margin: 0,
      filename: 'Ram_Vilas_Paswan_100_Page_Biography_v2.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 1.5, useCORS: true, letterRendering: true, backgroundColor: '#fffdf8' },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'], after: '.page' }
    };

    await html2pdf().set(opt).from(bookContainer).save();

  } catch(err) {
    console.error(err);
    alert('PDF डाउनलोड में त्रुटि। प्रिंट विकल्प का उपयोग करें।');
  } finally {
    renderBook();
    btn.disabled = false;
    btn.innerHTML = oldText;
  }
}

function openLogin() {
  document.getElementById('loginModal').style.display = 'grid';
}

function closeLogin() {
  document.getElementById('loginModal').style.display = 'none';
}

function doLogin() {
  const u = document.getElementById('loginUser').value;
  const p = document.getElementById('loginPass').value;
  if (u === 'admin' && p === 'paswan2026') {
    isLoggedIn = true;
    document.body.classList.add('editing');
    document.getElementById('loginBtn').style.display = 'none';
    closeLogin();
    renderBook();
    alert('संपादक लॉगिन सफल! अब आप किसी भी टेक्स्ट पर क्लिक करके सीधे संपादन कर सकते हैं।');
  } else {
    alert('गलत क्रेडेंशियल!');
  }
}

function logout() {
  isLoggedIn = false;
  document.body.classList.remove('editing');
  document.getElementById('loginBtn').style.display = 'inline-block';
  renderBook();
}

function saveEdits() {
  const activePage = bookData.pages[currentPage - 1];
  const pageNode = document.getElementById(`page-node-${currentPage}`);
  if (pageNode && activePage) {
    const h1 = pageNode.querySelector('h1, h2.h-title');
    if (h1) activePage.title = h1.innerText;
    
    const sub = pageNode.querySelector('.cover-sub, .h-kicker');
    if (sub) activePage.subtitle = sub.innerText;

    const paras = pageNode.querySelectorAll('p');
    paras.forEach((pEl, i) => {
      if (activePage.sections[i]) {
        activePage.sections[i].content = pEl.innerText;
      }
    });
  }

  localStorage.setItem('RAM_VILAS_BOOK_EDITED_V2', JSON.stringify(bookData));
  alert(`v2 पृष्ठ ${currentPage} के संपादन सफलतापूर्वक सहेजे गए!`);
}

function downloadHtml() {
